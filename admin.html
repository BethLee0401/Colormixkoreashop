<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COLORMIX 商品管理</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      background: #f6f3ee;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 28px 16px;
    }

    h1 {
      letter-spacing: 2px;
    }

    .card {
      margin: 16px 0;
      padding: 20px;
      background: #fff;
      border: 1px solid #ddd6cc;
      border-radius: 10px;
    }

    label {
      display: block;
      margin: 12px 0 5px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #bbb;
      border-radius: 6px;
      background: #fff;
      color: #222;
      font: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      padding: 11px 16px;
      border: 0;
      border-radius: 6px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .light {
      background: #eee;
      color: #222;
    }

    .danger {
      background: #a93636;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .hidden {
      display: none;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 14px;
    }

    .check input {
      width: auto;
    }

    .check label {
      margin: 0;
    }

    .item {
      padding: 14px 0;
      display: grid;
      grid-template-columns: 70px 1fr auto;
      align-items: center;
      gap: 12px;
      border-top: 1px solid #eee;
    }

    .item img {
      width: 70px;
      height: 88px;
      background: #eee;
      object-fit: cover;
    }

    .item-name {
      margin-bottom: 4px;
      font-weight: 700;
      line-height: 1.5;
    }

    .original-price {
      color: #888;
      font-size: 13px;
      text-decoration: line-through;
    }

    .sale-price {
      color: #b23b34;
      font-size: 15px;
      font-weight: 700;
    }

    .normal-price {
      font-size: 15px;
      font-weight: 700;
    }

    .tag {
 anspruchlos display: inline-block;
      margin: 5px 6px 0 0;
      padding: 3px 7px;
      border-radius: 4px;
      background: #eee;
      color: #555;
      font-size: 12px;
    }

    .tag.stock {
      background: #fff0ed;
      color: #a93636;
    }

    .msg {
      margin-top: 10px;
      color: #a93636;
      font-size: 14px;
      line-height: 1.6;
    }

    .hint {
      margin-top: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 600px) {
      .item {
        grid-template-columns: 60px 1fr;
      }

      .item .actions {
        grid-column: 1 / -1;
      }
    }
   
 
    #dashboard:not(.hidden) {
  display: grid;
  grid-template-columns: 180px minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.admin-menu {
  grid-column: 1;
  grid-row: 1 / span 4;
  position: sticky;
  top: 20px;
  padding: 12px;
  background: #fff;
  border: 1px solid #ddd6cc;
  border-radius: 10px;
}

.admin-menu button {
  width: 100%;
  margin-bottom: 8px;
  background: #eee;
  color: #222;
  text-align: left;
}

.admin-menu button.menu-active {
  background: #222;
  color: #fff;
}

#dashboard > .actions,
#dashboard > section {
  grid-column: 2;
}

.admin-page-hidden {
  display: none !important;
}

@media (max-width: 700px) {
  #dashboard:not(.hidden) {
    display: block;
  }

  .admin-menu {
    position: static;
    display: flex;
    gap: 8px;
    margin: 16px 0;
  }

  .admin-menu button {
    margin: 0;
    text-align: center;
  }
}
  </style>
</head>

<body>
  <div class="wrap">
    <h1>COLORMIX 商品管理</h1>

    <section id="loginBox" class="card">
      <h2>後台登入</h2>

      <label for="email">電子信箱</label>
      <input id="email" type="email">

      <label for="password">密碼</label>
      <input id="password" type="password">

      <div class="actions">
        <button id="login" type="button">登入</button>
      </div>

      <div id="loginMsg" class="msg"></div>
    </section>

    <main id="dashboard" class="hidden">
      <aside class="admin-menu">
  <button id="showProducts" class="menu-active" type="button">
    商品管理
  </button>

  <button id="showOrders" type="button">
    訂單管理
  </button>
</aside>
      <div class="actions">
        <button id="logout" class="light" type="button">
          登出
        </button>
      </div>

      <section class="card">
        <h2 id="formTitle">新增商品</h2>

        <input id="pid" type="hidden">

        <label for="name">商品名稱</label>
        <input id="name" type="text">

        <label for="price">商品原價</label>
        <input id="price" type="number" min="0">

        <label for="productType">商品類型</label>
        <select id="productType">
          <option value="live">連線商品｜維持原價</option>
          <option value="stock">現貨商品｜自動 85 折</option>
        </select>

        <div class="hint">
          選擇「現貨商品」後，官網會自動以原價的 85 折販售。
        </div>
<label for="category">商品分類</label>
<select id="category">
  <option value="tops">上半身</option>
  <option value="bottoms">下半身</option>
  <option value="dresses">洋裝</option>
  <option value="outer">外套</option>
  <option value="shoes">鞋子</option>
  <option value="accessories">飾品</option>
</select>
        <label for="size">尺寸</label>
        <input
          id="size"
          type="text"
          placeholder="例如：S／M／L"
        >

        <label for="color">顏色</label>
        <input
          id="color"
          type="text"
          placeholder="例如：深藍色"
        >

        <label for="desc">商品介紹</label>
        <textarea id="desc"></textarea>

        <label for="images">商品照片（最多5張）</label>
        <input
          id="images"
          type="file"
          accept="image/*"
          multiple
        >

        <div class="check">
          <input id="active" type="checkbox" checked>
          <label for="active">立即上架</label>
        </div>

        <div class="actions">
          <button id="save" type="button">儲存商品</button>

          <button id="cancel" class="light" type="button">
            取消編輯
          </button>
        </div>

        <div id="formMsg" class="msg"></div>
      </section>

      <section class="card">
        <h2>全部商品</h2>
        <div id="list"></div>
      </section>
      <section class="card">
  <div class="actions">
    <h2 style="margin:0;">訂單管理</h2>
    <button id="reloadOrders" class="light" type="button">
      重新整理訂單
    </button>
  </div>

  <div id="orderList">
    訂單載入中⋯
  </div>
</section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const db = supabase.createClient(
      "https://qwcpgwbaormtgpkjlaio.supabase.co",
      "sb_publishable_RpbXHPZD_JT1giXP4nd0mw_6MMIjs3l"
    );

    const $ = function (id) {
      return document.getElementById(id);
    };

    let rows = [];

    function salePrice(product) {
      const originalPrice = Number(product.price || 0);

      if (product.product_type === "stock") {
        return Math.round(originalPrice * 0.85);
      }

      return originalPrice;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeImages(value) {
      let images = value;

      if (typeof images === "string") {
        try {
          images = JSON.parse(images);
        } catch (error) {
          images = [images];
        }
      }

      if (!Array.isArray(images)) {
        return [];
      }

      return images.map(function (item) {
        if (typeof item === "string") {
          return item;
        }

        if (item && typeof item === "object") {
          return item.url || item.publicUrl || "";
        }

        return "";
      }).filter(Boolean);
    }

    async function session() {
      const {
        data: { session }
      } = await db.auth.getSession();

      const loggedIn = Boolean(session);

      $("loginBox").classList.toggle("hidden", loggedIn);
      $("dashboard").classList.toggle("hidden", !loggedIn);

      if (loggedIn) {
        await load();
await loadOrders();
      }
    }

    $("login").onclick = async function () {
      $("loginMsg").textContent = "";

      const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
      });

      if (error) {
        $("loginMsg").textContent =
          "登入失敗：" + error.message;
        return;
      }

      await session();
    };

    $("logout").onclick = async function () {
      await db.auth.signOut();
      await session();
    };

    async function load() {
      const { data, error } = await db
        .from("Products")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {
        $("list").textContent =
          "讀取失敗：" + error.message;
        return;
      }

      rows = data || [];
      $("list").innerHTML = "";

      if (!rows.length) {
        $("list").textContent = "目前沒有商品";
        return;
      }

      rows.forEach(function (product) {
        const pictures =
          normalizeImages(product.image_urls);

        const fallback =
          Number(product.id) === 1
            ? "image-1944593136204205.jpg"
            : "";

        const picture = pictures[0] || fallback;
        const finalPrice = salePrice(product);
        const isStock =
          product.product_type === "stock";

        const priceHtml = isStock
          ? `
            <div class="original-price">
              原價 NT$ ${Number(product.price || 0).toLocaleString("zh-TW")}
            </div>

            <div class="sale-price">
              現貨85折 NT$ ${finalPrice.toLocaleString("zh-TW")}
            </div>
          `
          : `
            <div class="normal-price">
              NT$ ${finalPrice.toLocaleString("zh-TW")}
            </div>
          `;

        const element = document.createElement("div");
        element.className = "item";

        element.innerHTML = `
          <img
            src="${escapeHtml(picture)}"
            alt="${escapeHtml(product.name)}"
          >

          <div>
            <div class="item-name">
              ${escapeHtml(product.name || "")}
            </div>

            ${priceHtml}

            <span class="tag ${isStock ? "stock" : ""}">
              ${isStock ? "現貨商品" : "連線商品"}
            </span>

            <span class="tag">
              ${product.active ? "已上架" : "已下架"}
            </span>
          </div>

          <div class="actions">
            <button class="light edit" type="button">
              編輯
            </button>

            <button class="danger delete" type="button">
              刪除
            </button>
          </div>
        `;

        element
          .querySelector(".edit")
          .addEventListener("click", function () {
            edit(product.id);
          });

        element
          .querySelector(".delete")
          .addEventListener("click", function () {
            removeProduct(product.id);
          });

        $("list").appendChild(element);
      });
    }

    function clearForm() {
      $("pid").value = "";
      $("name").value = "";
      $("price").value = "";
      $("productType").value = "live";
      $("category").value = "tops";
      $("size").value = "";
      $("color").value = "";
      $("desc").value = "";
      $("images").value = "";
      $("active").checked = true;
      $("formTitle").textContent = "新增商品";
      $("formMsg").textContent = "";
    }

    $("cancel").onclick = clearForm;

    function edit(id) {
      const product = rows.find(function (item) {
        return item.id === id;
      });

      if (!product) return;

      $("pid").value = product.id;
      $("name").value = product.name || "";
      $("price").value = product.price || "";
      $("productType").value =
  product.product_type || "live";
      $("category").value =
  product.category || "tops";
      $("size").value = product.size || "";
      $("color").value = product.color || "";
      $("desc").value = product.descripion || "";
      $("images").value = "";
      $("active").checked = Boolean(product.active);
      $("formTitle").textContent = "編輯商品";
      $("formMsg").textContent =
        "如不更換照片，照片欄位保持空白即可。";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

    async function uploadImages() {
      const urls = [];
      const files = Array.from($("images").files).slice(0, 5);

      for (const file of files) {
        const extension =
          file.name.split(".").pop() || "jpg";

        const path =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          extension;

        const { error } = await db.storage
          .from("product-images")
          .upload(path, file);

        if (error) {
          throw error;
        }

        const publicUrl = db.storage
          .from("product-images")
          .getPublicUrl(path)
          .data
          .publicUrl;

        urls.push(publicUrl);
      }

      return urls;
    }

    $("save").onclick = async function () {
      const saveButton = $("save");

      try {
        saveButton.disabled = true;
        saveButton.textContent = "儲存中⋯";
        $("formMsg").textContent = "儲存中⋯";

        const id = $("pid").value;

        const oldProduct = rows.find(function (item) {
          return String(item.id) === String(id);
        });

        const addedImages = await uploadImages();

        const payload = {
          name: $("name").value.trim(),
          price: Number($("price").value),
          product_type: $("productType").value,
          category: $("category").value,
          size: $("size").value.trim(),
          color: $("color").value.trim(),
          descripion: $("desc").value.trim(),
          active: $("active").checked,
          image_urls: addedImages.length
            ? addedImages
            : (oldProduct?.image_urls || [])
        };

        if (!payload.name || !$("price").value) {
          throw new Error("請填寫商品名稱和價格");
        }

        let result;

        if (id) {
          result = await db
            .from("Products")
            .update(payload)
            .eq("id", id);
        } else {
          result = await db
            .from("Products")
            .insert(payload);
        }

        if (result.error) {
          throw result.error;
        }

        clearForm();
        await load();

        $("formMsg").textContent = "商品儲存成功";
      } catch (error) {
        $("formMsg").textContent =
          "儲存失敗：" + error.message;
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "儲存商品";
      }
    };

    async function removeProduct(id) {
      const confirmed = window.confirm(
        "確定要刪除這件商品嗎？"
      );

      if (!confirmed) return;

      const { error } = await db
        .from("Products")
        .delete()
        .eq("id", id);

      if (error) {
        window.alert("刪除失敗：" + error.message);
      } else {
        await load();
      }
    }
async function loadOrders() {
  $("orderList").textContent = "訂單載入中⋯";

  const { data: orders, error } = await db
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    $("orderList").textContent =
      "讀取訂單失敗：" + error.message;
    return;
  }

  if (!orders || !orders.length) {
    $("orderList").textContent = "目前沒有訂單";
    return;
  }

  const orderIds = orders.map(function (order) {
    return order.id;
  });

  const { data: items, error: itemError } = await db
    .from("order_items")
    .select("*")
    .in("order_id", orderIds);

  if (itemError) {
    $("orderList").textContent =
      "讀取商品明細失敗：" + itemError.message;
    return;
  }

  const shippingNames = {
    family: "全家店到店",
    seven: "7-ELEVEN 店到店",
    post: "郵寄宅配"
  };

  const statusNames = {
    pending: "等待付款",
    paid: "已付款",
    shipping: "已出貨",
    completed: "已完成",
    cancelled: "已取消"
  };

  $("orderList").innerHTML = orders.map(function (order) {
    const orderItems = (items || []).filter(function (item) {
      return item.order_id === order.id;
    });

    const itemHtml = orderItems.map(function (item) {
      return `
        <div style="padding:8px 0;border-bottom:1px solid #eee;">
          <strong>${escapeHtml(item.product_name)}</strong><br>
          尺寸：${escapeHtml(item.size || "無")}　
          顏色：${escapeHtml(item.color || "無")}<br>
          NT$ ${Number(item.price || 0).toLocaleString("zh-TW")}
          × ${Number(item.quantity || 1)}
        </div>
      `;
    }).join("");

    return `
      <div class="card" style="background:#fafafa;">
        <h3>
          訂單編號：${escapeHtml(order.order_number)}
        </h3>

        <p>
          訂購時間：
          ${new Date(order.created_at).toLocaleString("zh-TW")}
        </p>

        <p>
          姓名：${escapeHtml(order.customer_name)}<br>
          電話：${escapeHtml(order.phone)}<br>
          寄送方式：
          ${escapeHtml(shippingNames[order.shipping_method] || order.shipping_method)}<br>
          寄送資料：${escapeHtml(order.shipping_address)}
        </p>

        ${order.note
          ? `<p>備註：${escapeHtml(order.note)}</p>`
          : ""}

        <div>${itemHtml}</div>

        <p>
          商品金額：NT$ ${Number(order.subtotal || 0).toLocaleString("zh-TW")}<br>
          運費：NT$ ${Number(order.shipping_fee || 0).toLocaleString("zh-TW")}<br>
          <strong>
            總金額：NT$ ${Number(order.total || 0).toLocaleString("zh-TW")}
          </strong>
        </p>

        <label>訂單狀態</label>
        <select class="order-status" data-id="${order.id}">
          ${Object.entries(statusNames).map(function ([value, label]) {
            return `
              <option
                value="${value}"
                ${order.status === value ? "selected" : ""}
              >
                ${label}
              </option>
            `;
          }).join("")}
        </select>
      </div>
    `;
  }).join("");

  document.querySelectorAll(".order-status").forEach(function (select) {
    select.addEventListener("change", async function () {
      const { error } = await db
        .from("orders")
        .update({ status: select.value })
        .eq("id", select.dataset.id);

      if (error) {
        window.alert("更新失敗：" + error.message);
      } else {
        window.alert("訂單狀態已更新");
      }
    });
  });
}

$("reloadOrders").onclick = loadOrders;
    function showAdminPage(page) {
  const sections =
    document.querySelectorAll("#dashboard > section");

  const showProductPage = page === "products";

  if (sections[0]) {
    sections[0].classList.toggle(
      "admin-page-hidden",
      !showProductPage
    );
  }

  if (sections[1]) {
    sections[1].classList.toggle(
      "admin-page-hidden",
      !showProductPage
    );
  }

  if (sections[2]) {
    sections[2].classList.toggle(
      "admin-page-hidden",
      showProductPage
    );
  }

  $("showProducts").classList.toggle(
    "menu-active",
    showProductPage
  );

  $("showOrders").classList.toggle(
    "menu-active",
    !showProductPage
  );

  if (!showProductPage) {
    loadOrders();
  }
}

$("showProducts").onclick = function () {
  showAdminPage("products");
};

$("showOrders").onclick = function () {
  showAdminPage("orders");
};

showAdminPage("products");
    db.auth.onAuthStateChange(function () {
      session();
    });

    session();
  </script>
</body>
</html>
