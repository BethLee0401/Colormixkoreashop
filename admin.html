<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>COLORMIX 商品管理</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans TC",sans-serif;background:#f6f3ee;color:#222}.wrap{max-width:900px;margin:auto;padding:28px 16px}h1{letter-spacing:2px}.card{background:#fff;border:1px solid #ddd6cc;border-radius:10px;padding:20px;margin:16px 0}label{display:block;margin:12px 0 5px;font-size:14px}input,textarea{width:100%;padding:11px;border:1px solid #bbb;border-radius:6px;font:inherit}textarea{min-height:90px}button{padding:11px 16px;border:0;border-radius:6px;background:#222;color:#fff;cursor:pointer}.light{background:#eee;color:#222}.danger{background:#a93636}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.hidden{display:none}.check{display:flex;gap:8px;align-items:center;margin-top:14px}.check input{width:auto}.check label{margin:0}.item{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border-top:1px solid #eee;padding:12px 0}.item img{width:70px;height:88px;object-fit:cover;background:#eee}.msg{color:#a93636;margin-top:10px;font-size:14px}@media(max-width:600px){.item{grid-template-columns:60px 1fr}.item .actions{grid-column:1/-1}}
</style></head><body><div class="wrap">
<h1>COLORMIX 商品管理</h1>
<section id="loginBox" class="card"><h2>後台登入</h2><label>電子信箱</label><input id="email" type="email"><label>密碼</label><input id="password" type="password"><div class="actions"><button id="login">登入</button></div><div id="loginMsg" class="msg"></div></section>
<main id="dashboard" class="hidden"><div class="actions"><button id="logout" class="light">登出</button></div>
<section class="card"><h2 id="formTitle">新增商品</h2><input id="pid" type="hidden"><label>商品名稱</label><input id="name"><label>價格</label><input id="price" type="number" min="0"><label>尺寸</label><input id="size" placeholder="例如：S／M／L"><label>顏色</label><input id="color" placeholder="例如：深藍色"><label>商品介紹</label><textarea id="desc"></textarea><label>商品照片（最多 5 張）</label><input id="images" type="file" accept="image/*" multiple><div class="check"><input id="active" type="checkbox" checked><label for="active">立即上架</label></div><div class="actions"><button id="save">儲存商品</button><button id="cancel" class="light">取消編輯</button></div><div id="formMsg" class="msg"></div></section>
<section class="card"><h2>全部商品</h2><div id="list"></div></section></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://qwcpgwbaormtgpkjlaio.supabase.co','sb_publishable_RpbXHPZD_JT1giXP4nd0mw_6MMIjs3l'),$=x=>document.getElementById(x);let rows=[];
async function session(){const{data}=await db.auth.getSession(),on=!!data.session;$('loginBox').classList.toggle('hidden',on);$('dashboard').classList.toggle('hidden',!on);if(on)load()}
$('login').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});$('loginMsg').textContent=error?'登入失敗：'+error.message:'';if(!error)session()};$('logout').onclick=async()=>{await db.auth.signOut();session()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const{data,error}=await db.from('Products').select('*').order('created_at',{ascending:false});if(error){$('list').textContent='讀取失敗：'+error.message;return}rows=data||[];$('list').innerHTML=rows.length?'':'目前沒有商品';rows.forEach(p=>{const pics=Array.isArray(p.image_urls)?p.image_urls:[],el=document.createElement('div');el.className='item';el.innerHTML='<img src="'+(pics[0]||'')+'"><div><b>'+esc(p.name||'')+'</b><div>NT$ '+Number(p.price||0).toLocaleString()+'</div><small>'+(p.active?'已上架':'已下架')+'</small></div><div class="actions"><button class="light edit">編輯</button><button class="danger del">刪除</button></div>';el.querySelector('.edit').onclick=()=>edit(p.id);el.querySelector('.del').onclick=()=>remove(p.id);$('list').appendChild(el)})}
function clearForm(){$('pid').value='';$('name').value='';$('price').value='';$('size').value='';$('color').value='';$('desc').value='';$('images').value='';$('active').checked=true;$('formTitle').textContent='新增商品';$('formMsg').textContent=''}$('cancel').onclick=clearForm;
function edit(id){const p=rows.find(x=>x.id===id);$('pid').value=p.id;$('name').value=p.name||'';$('price').value=p.price||'';$('desc').value=p.descripion||'';$('active').checked=!!p.active;$('formTitle').textContent='編輯商品';scrollTo({top:0,behavior:'smooth'})}
async function upload(){const urls=[];for(const f of [...$('images').files].slice(0,5)){const path=Date.now()+'-'+crypto.randomUUID()+'.'+f.name.split('.').pop();const{error}=await db.storage.from('product-images').upload(path,f);if(error)throw error;urls.push(db.storage.from('product-images').getPublicUrl(path).data.publicUrl)}return urls}
$('save').onclick=async()=>{try{$('formMsg').textContent='儲存中…';const id=$('pid').value,old=rows.find(x=>String(x.id)===id),added=await upload(),payload={name:$('name').value.trim(),price:Number($('price').value),descripion:$('desc').value.trim(),active:$('active').checked,image_urls:added.length?added:(old?.image_urls||[])};if(!payload.name||!$('price').value)throw Error('請填商品名稱和價格');const{error}=await(id?db.from('Products').update(payload).eq('id',id):db.from('Products').insert(payload));if(error)throw error;clearForm();await load()}catch(e){$('formMsg').textContent='儲存失敗：'+e.message}};
async function remove(id){if(!confirm('確定刪除這件商品？'))return;const{error}=await db.from('Products').delete().eq('id',id);if(error)alert(error.message);else load()}db.auth.onAuthStateChange(session);session();
</script></body></html>
