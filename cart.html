<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>購物車｜COLORMIX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      background: #f8f6f2;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .header {
      height: 72px;
      padding: 0 6%;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .header-links {
      display: flex;
      gap: 22px;
      font-size: 14px;
    }

    .container {
      width: min(1080px, calc(100% - 32px));
      margin: 45px auto 70px;
    }

    h1 {
      margin: 0 0 30px;
      font-size: 30px;
      letter-spacing: 2px;
    }

    h2 {
      margin: 0 0 22px;
      font-size: 21px;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.3fr 0.8fr;
      gap: 30px;
      align-items: start;
    }

    .card {
      padding: 28px;
      background: #fff;
      border: 1px solid #ddd;
    }

    .cart-item {
      display: grid;
      grid-template-columns: 110px 1fr auto;
      gap: 18px;
      padding: 20px 0;
      border-bottom: 1px solid #ddd;
    }

    .cart-item:first-child {
      padding-top: 0;
    }

    .cart-item:last-child {
      border-bottom: 0;
    }

    .product-image {
      width: 110px;
      height: 140px;
      background: #eee;
      object-fit: cover;
    }

    .product-name {
      margin-bottom: 10px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.5;
    }

    .product-option {
      margin: 5px 0;
      color: #666;
      font-size: 14px;
    }

    .original-price {
      margin-top: 10px;
      color: #888;
      font-size: 13px;
      text-decoration: line-through;
    }

    .sale-price {
      margin-top: 3px;
      color: #b23b34;
      font-size: 16px;
      font-weight: 700;
    }

    .normal-price {
      margin-top: 10px;
      font-size: 16px;
      font-weight: 700;
    }

    .quantity-row {
      margin-top: 15px;
      display: flex;
      align-items: center;
    }

    .quantity-btn {
      width: 35px;
      height: 35px;
      border: 1px solid #999;
      background: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .quantity-number {
      width: 42px;
      text-align: center;
      font-size: 15px;
    }

    .item-right {
      min-width: 100px;
      text-align: right;
    }

    .item-total {
      font-weight: 700;
    }

    .item-saving {
      margin-top: 5px;
      color: #b23b34;
      font-size: 12px;
    }

    .remove-btn {
      margin-top: 18px;
      padding: 0;
      border: 0;
      background: transparent;
      color: #777;
      font-size: 13px;
      text-decoration: underline;
      cursor: pointer;
    }

    .empty {
      padding: 55px 15px;
      color: #777;
      text-align: center;
      border: 1px dashed #bbb;
    }

    .empty a {
      display: inline-block;
      margin-top: 20px;
      padding: 13px 25px;
      background: #222;
      color: #fff;
    }

    .login-notice {
      margin-bottom: 20px;
      padding: 15px;
      border: 1px solid #c9b98a;
      background: #fffbea;
      font-size: 14px;
      line-height: 1.7;
    }

    .login-notice a {
      font-weight: 700;
      text-decoration: underline;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #aaa;
      border-radius: 0;
      background: #fff;
      color: #222;
      font-size: 16px;
    }

    input,
    select {
      height: 48px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .summary {
      margin: 25px 0 20px;
      padding-top: 18px;
      border-top: 1px solid #bbb;
    }

    .summary-row {
      margin: 11px 0;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font-size: 15px;
    }

    .discount-row {
      color: #b23b34;
      font-weight: 700;
    }

    .summary-row.total {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #bbb;
      font-size: 20px;
      font-weight: 700;
    }

    .free-shipping {
      margin-top: 10px;
      color: #785f24;
      font-size: 13px;
      line-height: 1.6;
    }

    .checkout-btn {
      width: 100%;
      height: 52px;
      border: 1px solid #222;
      background: #222;
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .checkout-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 13px;
      border: 1px solid #d8a2a2;
      background: #fff5f5;
      color: #9a1c1c;
      font-size: 14px;
      line-height: 1.6;
    }

    .success-box {
      padding: 40px 25px;
      background: #fff;
      border: 1px solid #bbb;
      text-align: center;
    }

    .success-box h2 {
      font-size: 25px;
    }

    .order-number {
      margin: 23px 0;
      padding: 16px;
      background: #f1f1f1;
      font-size: 19px;
      font-weight: 700;
    }

    .success-box p {
      line-height: 1.8;
    }

    .success-actions {
      margin-top: 25px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .success-actions a {
      padding: 13px 20px;
      border: 1px solid #222;
    }

    .success-actions a:first-child {
      background: #222;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 760px) {
      .header {
        height: 64px;
        padding: 0 18px;
      }

      .logo {
        font-size: 18px;
      }

      .header-links {
        gap: 13px;
        font-size: 13px;
      }

      .container {
        margin: 28px auto 50px;
      }

      .layout {
        display: block;
      }

      .checkout-card {
        margin-top: 20px;
      }

      .card {
        padding: 20px;
      }

      .cart-item {
        grid-template-columns: 85px 1fr;
        gap: 14px;
      }

      .product-image {
        width: 85px;
        height: 110px;
      }

      .item-right {
        grid-column: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
        text-align: left;
      }
    }
    .policy-agreement {
  display: flex;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 10px;
  width: 100%;
  text-align: left;
  line-height: 1.6;
}

.policy-agreement input[type="checkbox"] {
  flex: 0 0 auto;
  width: 16px;
  height: 16px;
  margin: 4px 0 0;
}

.policy-agreement label {
  display: block;
  flex: 1;
  margin: 0;
  text-align: left;
}
  </style>
</head>

<body>
  <header class="header">
    <a class="logo" href="index.html">COLORMIX</a>

    <nav class="header-links">
      <a href="index.html">商品</a>
      <a href="member.html">會員中心</a>
    </nav>
  </header>

  <main class="container">
    <h1>購物車</h1>

    <div id="message" class="message"></div>

    <section id="cartLayout" class="layout">
      <div class="card">
        <h2>購買商品</h2>
        <div id="cartItems"></div>
      </div>

      <div class="card checkout-card">
        <h2>結帳資料</h2>

        <div id="loginNotice" class="login-notice hidden">
          結帳前必須先登入會員。<br>
          <a href="member.html?return=cart.html">
            登入或加入會員
          </a>
        </div>

        <form id="checkoutForm">
          <div class="form-group">
            <label for="customerName">收件人姓名</label>
            <input id="customerName" type="text" required>
          </div>

          <div class="form-group">
            <label for="customerPhone">聯絡電話</label>
            <input
              id="customerPhone"
              type="tel"
              placeholder="例如：0912345678"
              required
            >
          </div>

          <div class="form-group">
            <label for="shippingMethod">寄送方式</label>

            <select id="shippingMethod" required>
              <option value="family">
                全家店到店｜運費 NT$60
              </option>

              <option value="seven">
                7-ELEVEN 店到店｜運費 NT$60
              </option>

              <option value="post">
                郵寄宅配｜運費 NT$80
              </option>
            </select>
          </div>

          <div class="form-group">

            <div class="form-group">
  <label for="paymentMethod">付款方式</label>

  <select id="paymentMethod" required>
    <option value="bank_transfer">
      銀行匯款
    </option>

    function updatePaymentMethod() {
  const paymentMethod =
    document.getElementById("paymentMethod");

  const paymentNotice =
    document.getElementById("paymentNotice");

  paymentMethod.value = "bank_transfer";

  paymentNotice.textContent =
    "付款方式：銀行匯款。訂單成立後請於24小時內完成付款。";
}

function renderCart() {
  updatePaymentMethod();
      if (!cart.length) {
        cartItemsElement.innerHTML = `
          <div class="empty">
            購物車目前沒有商品<br>
            <a href="index.html">前往選購商品</a>
          </div>
        `;

        checkoutButton.disabled = true;
        renderSummary();
        return;
      }

      cartItemsElement.innerHTML =
        cart.map(function (item, index) {
          const hasDiscount =
            item.original_price > item.price;

          const priceHtml = hasDiscount
            ? `
              <div class="original-price">
                原價 ${money(item.original_price)}
              </div>

              <div class="sale-price">
                ${money(item.price)}
              </div>
            `
            : `
              <div class="normal-price">
                ${money(item.price)}
              </div>
            `;

          const savedAmount =
            (item.original_price - item.price) *
            item.quantity;

          return `
            <article class="cart-item">
              ${
                item.image
                  ? `
                    <img
                      class="product-image"
                      src="${escapeHtml(item.image)}"
                      alt="${escapeHtml(item.name)}"
                    >
                  `
                  : `<div class="product-image"></div>`
              }

              <div>
                <div class="product-name">
  ${escapeHtml(item.name)}

  <span
    style="
      display:inline-block;
      margin-left:8px;
      padding:3px 8px;
      border-radius:20px;
      background:${item.is_preorder ? "#8d555c" : "#d8ead8"};
      color:${item.is_preorder ? "#ffffff" : "#315f37"};
      font-size:12px;
      font-weight:700;
      vertical-align:middle;
    "
  >
    ${item.is_preorder ? "預購" : "現貨"}
  </span>
</div>

                ${
                  item.size
                    ? `
                      <div class="product-option">
                        尺寸：${escapeHtml(item.size)}
                      </div>
                    `
                    : ""
                }

                ${
                  item.color
                    ? `
                      <div class="product-option">
                        顏色：${escapeHtml(item.color)}
                      </div>
                    `
                    : ""
                }

                ${priceHtml}

                <div class="quantity-row">
                  <button
                    class="quantity-btn"
                    type="button"
                    onclick="changeQuantity(${index}, -1)"
                  >−</button>

                  <span class="quantity-number">
                    ${item.quantity}
                  </span>

                  <button
                    class="quantity-btn"
                    type="button"
                    onclick="changeQuantity(${index}, 1)"
                  >＋</button>
                </div>
              </div>

              <div class="item-right">
                <div class="item-total">
                  ${money(item.price * item.quantity)}
                </div>

                ${
                  savedAmount > 0
                    ? `
                      <div class="item-saving">
                        已折 ${money(savedAmount)}
                      </div>
                    `
                    : ""
                }

                <button
                  class="remove-btn"
                  type="button"
                  onclick="removeItem(${index})"
                >
                  刪除
                </button>
              </div>
            </article>
          `;
        }).join("");

      checkoutButton.disabled = !currentUser;
      renderSummary();
    }

    function changeQuantity(index, amount) {
      cart[index].quantity += amount;

      if (cart[index].quantity < 1) {
        cart[index].quantity = 1;
      }

      saveCart();
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      saveCart();
      renderCart();
    }

    function updateShippingFields() {
      if (shippingMethod.value === "family") {
        addressLabel.textContent =
          "全家店名／店號";

        shippingAddress.placeholder =
          "請填寫全家門市名稱與店號";
      } else if (shippingMethod.value === "seven") {
        addressLabel.textContent =
          "7-ELEVEN 店名／店號";

        shippingAddress.placeholder =
          "請填寫 7-ELEVEN 門市名稱與店號";
      } else {
        addressLabel.textContent =
          "完整收件地址";

        shippingAddress.placeholder =
          "請填寫郵遞區號與完整地址";
      }

      renderSummary();
    }

    function showMessage(text) {
      const message =
        document.getElementById("message");

      message.textContent = text;
      message.style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }

  async function fillCheckoutFromProfile(user) {
  if (!user) return null;

  const { data: profile, error } = await db
    .from("member_profiles")
    .select(
      "name, phone, address, shipping_preference, store_name, store_number"
    )
    .eq("user_id", user.id)
    .maybeSingle();

  if (error) {
    console.error("讀取會員資料失敗：", error);
    return null;
  }

  if (!profile) return null;

  document.getElementById("customerName").value =
    profile.name || "";

  document.getElementById("customerPhone").value =
    profile.phone || "";

  let savedMethod = profile.shipping_preference;

  if (savedMethod === "home") {
    savedMethod = "post";
  }

  if (
    savedMethod !== "family" &&
    savedMethod !== "seven" &&
    savedMethod !== "post"
  ) {
    savedMethod = "post";
  }

  shippingMethod.value = savedMethod;
  updateShippingFields();

  if (
    savedMethod === "family" ||
    savedMethod === "seven"
  ) {
    const storeInformation = [
      profile.store_name,
      profile.store_number
    ]
      .filter(Boolean)
      .join("／");

    shippingAddress.value =
      storeInformation || profile.address || "";
  } else {
    shippingAddress.value = profile.address || "";
  }

  return profile;
}

async function checkLogin() {
  const {
    data: { session },
    error
  } = await db.auth.getSession();

  if (error) {
    console.error(
      "讀取登入狀態失敗：",
      error
    );
  }

  currentUser = session?.user || null;
  canUseCod = false;

  let profile = null;

  if (currentUser) {
    profile = await fillCheckoutFromProfile(
      currentUser
    );

    const {
      data: completedOrders,
      error: completedOrderError
    } = await db
      .from("orders")
      .select("id")
      .eq("user_id", currentUser.id)
      .eq("status", "completed")
      .limit(1);

    if (completedOrderError) {
      console.error(
        "讀取交易紀錄失敗：",
        completedOrderError
      );
    } else {
      canUseCod =
        Array.isArray(completedOrders) &&
        completedOrders.length > 0;
    }
  }

  const memberLink =
    document.querySelector(
      'header a[href="member.html"]'
    );

  if (memberLink) {
    if (currentUser && profile?.name) {
      memberLink.textContent =
        "歡迎，" + profile.name + "會員";
    } else if (currentUser) {
      memberLink.textContent = "會員中心";
    } else {
      memberLink.textContent =
        "登入／加入會員";
    }
  }

  document
    .getElementById("loginNotice")
    .classList.toggle(
      "hidden",
      Boolean(currentUser)
    );

  checkoutButton.disabled =
    !currentUser || cart.length === 0;

  renderCart();
}

shippingMethod.addEventListener(
  "change",
  updateShippingFields
);

    document
      .getElementById("checkoutForm")
      .addEventListener(
        "submit",
        async function (event) {
          event.preventDefault();

          if (!currentUser) {
            location.href =
              "member.html?return=cart.html";
            return;
          }

          if (!cart.length) {
            showMessage("購物車目前沒有商品。");
            return;
          }

          const name =
            document
              .getElementById("customerName")
              .value
              .trim();

          const phone =
            document
              .getElementById("customerPhone")
              .value
              .trim();

          const address =
            shippingAddress.value.trim();

          const note =
            document
              .getElementById("orderNote")
              .value
              .trim();

          if (!name || !phone || !address) {
            showMessage("請完整填寫收件資料。");
            return;
          }

          if (!/^09\d{8}$/.test(
            phone.replace(/[-\s]/g, "")
          )) {
            showMessage(
              "請填寫正確的手機號碼，例如0912345678。"
            );
            return;
          }

          checkoutButton.disabled = true;
          checkoutButton.textContent =
            "訂單建立中⋯";

          const items = cart.map(function (item) {
            return {
              product_id: item.product_id,
              quantity: item.quantity,
              size: item.size,
              color: item.color
            };
          });

        const paymentMethod =
  document.getElementById("paymentMethod").value;

if (
  paymentMethod === "convenience_store_cod" &&
  shippingMethod.value === "post"
) {
  checkoutButton.disabled = false;
  checkoutButton.textContent =
    "確認成立訂單";

  showMessage(
    "超商取貨付款必須選擇全家或 7-ELEVEN 店到店。"
  );
  return;
}

const { data, error } = await db.rpc(
  "create_order",
  {
    p_customer_name: name,
    p_phone: phone,
    p_shipping_method:
      shippingMethod.value,
    p_shipping_address: address,
    p_note: note,
    p_items: items
  }
);

          checkoutButton.disabled = false;
          checkoutButton.textContent =
            "確認成立訂單";

          if (error) {
            showMessage(
              "訂單建立失敗：" + error.message
            );
            return;
          }

          const orderNumber =
  data?.order_number || "";

document
  .getElementById("facebookOrderLink")
  .onclick = function (event) {
    event.preventDefault();

    const message =
      "您好，我的訂單編號是 " +
      orderNumber +
      "，請提供轉帳資料，謝謝。";

    navigator.clipboard
      .writeText(message)
      .catch(function () {});

    window.open(
      "https://m.me/100063898780134",
      "_blank"
    );

    window.alert(
      "訂單訊息已複製，請在 Facebook 對話中貼上並傳送。"
    );
  };
          document
  .getElementById("instagramOrderLink")
  .onclick = function (event) {
    event.preventDefault();

    const message =
      "您好，我的訂單編號是 " +
      orderNumber +
      "，請提供轉帳資料，謝謝。";

    navigator.clipboard
      .writeText(message)
      .catch(function () {});

    window.open(
      "https://ig.me/m/colormix637",
      "_blank"
    );

    window.alert(
      "訂單訊息已複製，請在 Instagram 對話中貼上並傳送。"
    );
  };

          cart = [];
          saveCart();

          document
            .getElementById("cartLayout")
            .classList.add("hidden");

          document
            .getElementById("successBox")
            .classList.remove("hidden");

          document
  .getElementById("successOrderNumber")
  .textContent = orderNumber
    ? "訂單編號：" + orderNumber
    : "訂單已成功建立";

const successMessage =
  document.querySelector("#successBox p");

const facebookButton =
  document.getElementById("facebookOrderLink");

const instagramButton =
  document.getElementById("instagramOrderLink");

if (
  paymentMethod === "convenience_store_cod"
) {
  successMessage.innerHTML = `
    此訂單付款方式為
    <strong>超商取貨付款</strong>。<br>
    商品送達指定門市後，請於期限內前往取貨並付款。<br><br>
    <strong style="color:#a93434;">
      請留意到貨通知，未取件可能影響日後使用
      超商取貨付款的權限。
    </strong>
  `;

  facebookButton.style.display = "none";
  instagramButton.style.display = "none";
} else {
  successMessage.innerHTML = `
    請點選下方 Facebook 或 Instagram
    私訊店家索取轉帳帳號。<br>
    完成轉帳後，請至會員中心回報轉帳後五碼。<br><br>
    <strong style="color:#a93434;">
      請於訂單成立後 24 小時內完成付款，
      逾時未付款的訂單將自動取消。
    </strong>
  `;

  facebookButton.style.display = "";
  instagramButton.style.display = "";
}
          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });
        }
      );

    loadCart();
    updateShippingFields();
    checkLogin();
  </script>
</body>
</html>
