<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品介紹｜COLORMIX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: #222;
      background: #f8f6f2;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font-family: inherit;
    }

    .header {
      height: 72px;
      padding: 0 6%;
      background: #fff;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
    }

    .header-links {
      display: flex;
      align-items: center;
      gap: 22px;
      font-size: 14px;
    }

    .cart-link {
      position: relative;
    }

    .cart-count {
      display: none;
      position: absolute;
      top: -11px;
      right: -12px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font-size: 11px;
      line-height: 18px;
      text-align: center;
    }

    .wrap {
      width: min(1100px, calc(100% - 32px));
      margin: 30px auto 70px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #555;
      font-size: 14px;
    }

    .product-layout {
      display: grid;
      grid-template-columns: 1fr 0.82fr;
      gap: 55px;
      align-items: start;
    }

    .main-image {
      display: block;
      width: 100%;
      max-height: 760px;
      background: #eee;
      object-fit: cover;
    }

    .thumbnails {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 9px;
      margin-top: 10px;
    }

    .thumbnail {
      width: 100%;
      aspect-ratio: 1 / 1.25;
      padding: 0;
      border: 1px solid transparent;
      background: #eee;
      cursor: pointer;
      overflow: hidden;
    }

    .thumbnail.active {
      border-color: #222;
    }

    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      position: sticky;
      top: 25px;
      padding-top: 5px;
    }

    .product-name {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.5;
      letter-spacing: 1px;
    }

    .price {
      margin-bottom: 22px;
      font-size: 23px;
      font-weight: 700;
    }

    .divider {
      height: 1px;
      margin: 22px 0;
      background: #bbb;
    }

    .option-group {
      margin-bottom: 24px;
    }

    .option-title {
      margin-bottom: 11px;
      font-size: 15px;
      font-weight: 700;
    }

    .option-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .option-button {
      min-width: 54px;
      min-height: 42px;
      padding: 9px 15px;
      border: 1px solid #aaa;
      background: #fff;
      color: #222;
      font-size: 14px;
      cursor: pointer;
    }

    .option-button.selected {
      border-color: #222;
      background: #222;
      color: #fff;
    }

    .quantity {
      display: flex;
      align-items: center;
    }

    .quantity button {
      width: 42px;
      height: 42px;
      border: 1px solid #999;
      background: #fff;
      font-size: 19px;
      cursor: pointer;
    }

    .quantity-number {
      width: 50px;
      text-align: center;
      font-size: 16px;
    }

    .description-title {
      margin-bottom: 15px;
      font-size: 17px;
      font-weight: 700;
    }

    .description {
      color: #444;
      font-size: 16px;
      line-height: 1.9;
      white-space: pre-line;
    }

    .add-button {
      width: 100%;
      height: 55px;
      margin-top: 28px;
      border: 1px solid #222;
      background: #222;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
    }

    .add-button:hover {
      background: #444;
    }

    .add-button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .buy-note {
      margin-top: 13px;
      color: #666;
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }

    .notice {
      display: none;
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 20;
      max-width: calc(100% - 44px);
      padding: 15px 20px;
      background: #222;
      color: #fff;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
    }

    .error {
      padding: 60px 20px;
      background: #fff;
      border: 1px solid #ddd;
      text-align: center;
      line-height: 1.8;
    }

    .loading {
      padding: 80px 20px;
      color: #777;
      text-align: center;
    }

    @media (max-width: 760px) {
      .header {
        height: 64px;
        padding: 0 18px;
      }

      .logo {
        font-size: 18px;
        letter-spacing: 3px;
      }

      .header-links {
        gap: 13px;
        font-size: 13px;
      }

      .wrap {
        margin-top: 22px;
      }

      .product-layout {
        display: block;
      }

      .product-info {
        position: static;
        padding-top: 30px;
      }

      .product-name {
        font-size: 23px;
      }

      .price {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>
  <header class="header">
    <a class="logo" href="index.html">COLORMIX</a>

    <nav class="header-links">
      <a href="index.html">商品</a>
      <a href="member.html">會員中心</a>

      <a class="cart-link" href="cart.html">
        購物車
        <span id="cartCount" class="cart-count">0</span>
      </a>
    </nav>
  </header>

  <main class="wrap">
    <a class="back" href="index.html">← 回到商品列表</a>

    <div id="loading" class="loading">
      商品載入中⋯
    </div>

    <section id="productLayout" class="product-layout" hidden>
      <div>
        <img
          id="mainImage"
          class="main-image"
          src=""
          alt=""
        >

        <div id="thumbnails" class="thumbnails"></div>
      </div>

      <div class="product-info">
        <h1 id="productName" class="product-name"></h1>

        <div id="productPrice" class="price"></div>
        <div
  id="stockStatus"
  style="margin-top:10px;font-size:14px;font-weight:700;"
></div>

        <div class="divider"></div>

        <div id="sizeGroup" class="option-group">
          <div class="option-title">尺寸</div>
          <div id="sizeButtons" class="option-buttons"></div>
        </div>

        <div id="colorGroup" class="option-group">
          <div class="option-title">顏色</div>
          <div id="colorButtons" class="option-buttons"></div>
        </div>

        <div class="option-group">
          <div class="option-title">數量</div>

          <div class="quantity">
            <button
              id="minusButton"
              type="button"
              aria-label="減少數量"
            >−</button>

            <span id="quantityNumber" class="quantity-number">1</span>

            <button
              id="plusButton"
              type="button"
              aria-label="增加數量"
            >＋</button>
          </div>
        </div>

        <div class="divider"></div>

        <div class="description-title">商品介紹</div>
        <div id="productDescription" class="description"></div>

        <div class="divider"></div>

        <button id="addButton" class="add-button" type="button">
          加入購物車
        </button>

        <div class="buy-note">
          滿 NT$10,000 免運<br>
          全家、7-ELEVEN 運費 NT$60｜郵寄運費 NT$80
        </div>
      </div>
    </section>

    <div id="errorBox" class="error" hidden>
      找不到這項商品，商品可能已下架。<br>
      <a href="index.html">返回商品列表</a>
    </div>
  </main>

  <div id="notice" class="notice"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://qwcpgwbaormtgpkjlaio.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_RpbXHPZD_JT1giXP4nd0mw_6MMIjs3l";

    const db = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const CART_KEY = "colormix_cart";

    let product = null;
    let variants = [];
    let selectedSize = "";
    let selectedColor = "";
    let quantity = 1;

    const fallbackImages = [
      "image-1944593136204205.jpg",
      "IMG_7064.JPG",
      "IMG_7065.JPG",
      "IMG_7062.JPG",
      "IMG_7063.JPG"
    ];
function money(value) {
  return "NT$ " + Number(value || 0).toLocaleString("zh-TW");
}
    function salePrice(item) {
  
  const originalPrice = Number(item.price || 0);

  if (item.product_type === "stock") {
    return Math.round(originalPrice * 0.85);
  }

  return originalPrice;
}

    function parseOptions(value) {
      if (!value) return [];

      return String(value)
        .split(/[\/／,，、]/)
        .map(function (item) {
          return item.trim();
        })
        .filter(Boolean);
    }

    function normalizeImages(value) {
      let images = value;

      if (typeof images === "string") {
        try {
          images = JSON.parse(images);
        } catch (error) {
          images = [images];
        }
      }

      if (!Array.isArray(images)) {
        return [];
      }

      return images.map(function (item) {
        if (typeof item === "string") {
          return item;
        }

        if (item && typeof item === "object") {
          return item.url || item.publicUrl || "";
        }

        return "";
      }).filter(Boolean);
    }

    function updateCartCount() {
      let cart = [];

      try {
        cart = JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );
      } catch (error) {
        cart = [];
      }

      const count = Array.isArray(cart)
        ? cart.reduce(function (total, item) {
            return total + Number(item.quantity || 1);
          }, 0)
        : 0;

      const cartCount =
        document.getElementById("cartCount");

      cartCount.textContent = count;
      cartCount.style.display = count > 0 ? "block" : "none";
    }

    function createOptionButtons(
      containerId,
      options,
      type
    ) {
      const container =
        document.getElementById(containerId);

      container.innerHTML = "";

      if (!options.length) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "option-button selected";
        button.textContent = "單一規格";
        container.appendChild(button);

        if (type === "size") {
          selectedSize = "單一規格";
        } else {
          selectedColor = "單一顏色";
        }

        return;
      }

      options.forEach(function (option, index) {
        const button = document.createElement("button");

        button.type = "button";
        button.className =
          "option-button" + (index === 0 ? " selected" : "");
        button.textContent = option;

        button.addEventListener("click", function () {
          container
            .querySelectorAll(".option-button")
            .forEach(function (item) {
              item.classList.remove("selected");
            });

          button.classList.add("selected");

          if (type === "size") {
            selectedSize = option;
          } else {
            selectedColor = option;
          }
        });

        container.appendChild(button);
      });

      if (type === "size") {
        selectedSize = options[0];
      } else {
        selectedColor = options[0];
      }
    }

    function updateSelectedVariantStatus() {
  const stockStatus =
    document.getElementById("stockStatus");

  const addButton =
    document.getElementById("addButton");

  const selectedVariant = variants.find(function (variant) {
    const sizeMatches =
      !variant.size ||
      variant.size === selectedSize ||
      selectedSize === "單一規格";

    const colorMatches =
      !variant.color ||
      variant.color === selectedColor ||
      selectedColor === "單一顏色";

    return sizeMatches && colorMatches;
  });

  if (variants.length && !selectedVariant) {
    stockStatus.textContent = "此尺寸與顏色無法選購";
    stockStatus.style.color = "#a93636";
    addButton.disabled = true;
    return;
  }

  addButton.disabled = false;

  if (product.product_type !== "stock") {
    stockStatus.textContent = "連線商品";
    stockStatus.style.color = "#555";
    return;
  }

  const stock = Number(
    selectedVariant?.stock ??
    product.stock_quantity ??
    0
  );

  if (stock > 0) {
    stockStatus.textContent =
      "現貨｜此規格剩餘 " + stock + " 件";
    stockStatus.style.color = "#b23b34";
  } else {
    stockStatus.textContent =
      "追加商品｜到貨後依訂單順序出貨";
    stockStatus.style.color = "#555";
  }
}
    function renderImages(images) {
      const mainImage =
        document.getElementById("mainImage");

      const thumbnails =
        document.getElementById("thumbnails");

      mainImage.src = images[0];
      mainImage.alt = product.name;
      thumbnails.innerHTML = "";

      images.forEach(function (imageUrl, index) {
        const button = document.createElement("button");
        button.type = "button";
        button.className =
          "thumbnail" + (index === 0 ? " active" : "");

        const image = document.createElement("img");
        image.src = imageUrl;
        image.alt = product.name + " 商品圖片 " + (index + 1);

        button.appendChild(image);

        button.addEventListener("click", function () {
          mainImage.src = imageUrl;

          thumbnails
            .querySelectorAll(".thumbnail")
            .forEach(function (item) {
              item.classList.remove("active");
            });

          button.classList.add("active");
        });

        thumbnails.appendChild(button);
      });

      thumbnails.style.display =
        images.length > 1 ? "grid" : "none";
    }

    function showNotice(text) {
      const notice = document.getElementById("notice");

      notice.textContent = text;
      notice.style.display = "block";

      window.setTimeout(function () {
        notice.style.display = "none";
      }, 2500);
    }

    function addToCart() {
      let cart = [];

      try {
        cart = JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );
      } catch (error) {
        cart = [];
      }

      if (!Array.isArray(cart)) {
        cart = [];
      }

      const images = normalizeImages(product.image_urls);
      const selectedImage =
        images[0] ||
        (Number(product.id) === 1 ? fallbackImages[0] : "");

      const sameItem = cart.find(function (item) {
        return (
          Number(item.product_id || item.id) === Number(product.id) &&
          item.size === selectedSize &&
          item.color === selectedColor
        );
      });

      if (sameItem) {
        sameItem.quantity =
          Number(sameItem.quantity || 1) + quantity;
      } else {
        cart.push({
          product_id: Number(product.id),
          name: product.name,
          original_price: Number(product.price),
          price: salePrice(product),
          size: selectedSize,
          color: selectedColor,
          quantity: quantity,
          image: selectedImage
        });
      }

      localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
      );

      updateCartCount();
      showNotice("商品已加入購物車");

      quantity = 1;
      document.getElementById("quantityNumber").textContent = "1";
    }

    async function loadProduct() {
      const params = new URLSearchParams(location.search);
      const productId = Number(params.get("id"));

      if (!productId) {
        showError();
        return;
      }

      const { data, error } = await db
        .from("Products")
        .select("*")
        .eq("id", productId)
        .eq("active", true)
        .single();

      if (error || !data) {
        showError();
        return;
      }

      product = data;
      const { data: variantData, error: variantError } =
  await db
    .from("product_variants")
    .select("*")
    .eq("product_id", product.id)
    .eq("active", true)
    .order("id", { ascending: true });

variants = variantError
  ? []
  : (variantData || []);

      document.title =
        product.name + "｜COLORMIX";

      document.getElementById("productName").textContent =
        product.name;

      const finalPrice = salePrice(product);

document.getElementById("productPrice").innerHTML =
  product.product_type === "stock"
    ? '<span style="font-size:15px;color:#888;text-decoration:line-through;">原價 ' +
      money(product.price) +
      '</span><br><span style="color:#b23b34;">' +
      money(finalPrice) +
      "</span>"
    : money(finalPrice);

      const stockQuantity =
  Number(product.stock_quantity || 0);

const stockStatus =
  document.getElementById("stockStatus");

if (product.product_type === "stock") {
  if (stockQuantity > 0) {
    stockStatus.textContent =
      "現貨｜剩餘 " + stockQuantity + " 件";
    stockStatus.style.color = "#b23b34";
  } else {
    stockStatus.textContent =
      "追加商品｜到貨後依訂單順序出貨";
    stockStatus.style.color = "#555";
  }
} else {
  stockStatus.textContent = "連線商品";
  stockStatus.style.color = "#555";
}
      document.getElementById("productDescription").textContent =
        product.descripion ||
        "COLORMIX 精選正韓服飾，簡約好搭，輕鬆穿出日常質感。";

     const sizes = variants.length
  ? [
      ...new Set(
        variants
          .map(function (variant) {
            return variant.size;
          })
          .filter(Boolean)
      )
    ]
  : parseOptions(product.size);

const colors = variants.length
  ? [
      ...new Set(
        variants
          .map(function (variant) {
            return variant.color;
          })
          .filter(Boolean)
      )
    ]
  : parseOptions(product.color);

      createOptionButtons(
        "sizeButtons",
        sizes,
        "size"
      );

      createOptionButtons(
        "colorButtons",
        colors,
        "color"
      );

      let images = normalizeImages(product.image_urls);

      if (!images.length && Number(product.id) === 1) {
        images = fallbackImages;
      }

      if (!images.length) {
        images = [
          "https://placehold.co/800x1000/f0f0f0/777?text=COLORMIX"
        ];
      }

      renderImages(images);

      document.getElementById("loading").hidden = true;
      document.getElementById("productLayout").hidden = false;
    }

    function showError() {
      document.getElementById("loading").hidden = true;
      document.getElementById("productLayout").hidden = true;
      document.getElementById("errorBox").hidden = false;
    }

    document
      .getElementById("minusButton")
      .addEventListener("click", function () {
        if (quantity > 1) {
          quantity -= 1;
          document.getElementById("quantityNumber").textContent =
            quantity;
        }
      });

    document
      .getElementById("plusButton")
      .addEventListener("click", function () {
        quantity += 1;
        document.getElementById("quantityNumber").textContent =
          quantity;
      });

    document
      .getElementById("addButton")
      .addEventListener("click", addToCart);

    updateCartCount();
    loadProduct();
  </script>
</body>
</html>
