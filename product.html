<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>商品｜COLORMIX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans TC", sans-serif;
      background: #f8f6f2;
      color: #222;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #222;
      text-decoration: none;
      font-size: 14px;
    }

    .product-page {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 50px;
      align-items: start;
    }

    .main-image {
      width: 100%;
      overflow: hidden;
      background: #eee;
    }

    .main-image img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    .empty-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
      color: #888;
      background: #eee;
    }

    .thumbnails {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .thumbnail {
      padding: 0;
      border: 1px solid #ddd;
      background: none;
      cursor: pointer;
      overflow: hidden;
    }

    .thumbnail img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
    }

    .product-info {
      position: sticky;
      top: 30px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 28px;
      line-height: 1.5;
      font-weight: 600;
    }

    .price {
      margin-bottom: 28px;
      font-size: 24px;
      font-weight: bold;
    }

    .divider {
      border-top: 1px solid #ddd;
      margin: 25px 0;
    }

    .note {
      color: #555;
      font-size: 14px;
      line-height: 1.8;
    }

    .note p {
      margin: 0 0 14px;
    }

    .description {
      white-space: pre-line;
    }

    .buy-btn {
      display: block;
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: 1px solid #222;
      border-radius: 3px;
      background: #222;
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 15px;
    }

    .ig-btn {
      background: white;
      color: #222;
    }

    .buy-btn:hover {
      opacity: 0.8;
    }

    .loading,
    .error {
      padding: 40px 0;
      color: #666;
    }

    @media (max-width: 768px) {
      .product-page {
        grid-template-columns: 1fr;
        gap: 25px;
      }

      .product-info {
        position: static;
      }

      h1 {
        font-size: 22px;
      }

      .price {
        font-size: 21px;
      }

      .thumbnails {
        gap: 6px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <a class="back" href="index.html">← 回到首頁</a>

    <div id="productPage" class="loading">
      商品載入中…
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const supabaseUrl =
      "https://qwcpgwbaormtgpkjlaio.supabase.co";

    const supabaseKey =
      "sb_publishable_RpbXHPZD_JT1giXP4nd0mw_6MMIjs3l";

    const supabaseClient = supabase.createClient(
      supabaseUrl,
      supabaseKey
    );

    const productId =
      new URLSearchParams(window.location.search).get("id");

    function escapeHtml(value) {
      return String(value ?? "").replace(
        /[&<>"']/g,
        character => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[character]
      );
    }

    function getProductImages(product) {
      if (
        Array.isArray(product.image_urls) &&
        product.image_urls.length > 0
      ) {
        return product.image_urls;
      }

      if (Number(product.id) === 1) {
        return [
          "image-1944593136204205.jpg",
          "IMG_7064.JPG",
          "IMG_7065.JPG",
          "IMG_7062.JPG",
          "IMG_7063.JPG"
        ];
      }

      return [];
    }

    async function loadProduct() {
      const productPage =
        document.getElementById("productPage");

      if (!productId) {
        productPage.className = "error";
        productPage.textContent = "找不到商品。";
        return;
      }

      const { data: product, error } =
        await supabaseClient
          .from("Products")
          .select("*")
          .eq("id", productId)
          .eq("active", true)
          .single();

      if (error || !product) {
        productPage.className = "error";
        productPage.textContent =
          "找不到商品，商品可能已經下架。";
        return;
      }

      const images = getProductImages(product);

      document.title =
        product.name + "｜COLORMIX";

      const mainImage = images.length
        ? `
          <img
            id="mainProductImage"
            src="${escapeHtml(images[0])}"
            alt="${escapeHtml(product.name)}"
          >
        `
        : `
          <div class="empty-image">
            尚未上傳照片
          </div>
        `;

      const thumbnails = images.map(
        image => `
          <button
            type="button"
            class="thumbnail"
            data-image="${escapeHtml(image)}"
          >
            <img
              src="${escapeHtml(image)}"
              alt="${escapeHtml(product.name)}"
            >
          </button>
        `
      ).join("");

      productPage.className = "product-page";

      productPage.innerHTML = `
        <div>
          <div class="main-image" id="mainImage">
            ${mainImage}
          </div>

          <div class="thumbnails">
            ${thumbnails}
          </div>
        </div>

        <div class="product-info">

          <h1>${escapeHtml(product.name)}</h1>

          <div class="price">
            NT$ ${Number(product.price).toLocaleString()}
          </div>

          <div class="divider"></div>

          <div class="note">
            <p>
              <strong>尺寸：</strong>
              ${escapeHtml(product.size || "")}
            </p>

            <p>
              <strong>顏色：</strong>
              ${escapeHtml(product.color || "")}
            </p>

            <br>

            <p><strong>商品介紹</strong></p>

            <p class="description">
              ${escapeHtml(product.descripion || "")}
            </p>
          </div>

          <div class="divider"></div>

          <a
            href="https://www.facebook.com/share/1DdW5b2iau/?mibextid=wwXIfr"
            target="_blank"
            rel="noopener noreferrer"
            class="buy-btn"
          >
            Facebook 私訊購買
          </a>

          <a
            href="https://www.instagram.com/colormix637?stkn=MW1pdHhvOXR5ZGdnNg=="
            target="_blank"
            rel="noopener noreferrer"
            class="buy-btn ig-btn"
          >
            Instagram 私訊購買
          </a>

        </div>
      `;

      document
        .querySelectorAll(".thumbnail")
        .forEach(button => {
          button.addEventListener("click", () => {
            const selectedImage =
              button.dataset.image;

            document.getElementById(
              "mainImage"
            ).innerHTML = `
              <img
                id="mainProductImage"
                src="${escapeHtml(selectedImage)}"
                alt="${escapeHtml(product.name)}"
              >
            `;

            window.scrollTo({
              top: 0,
              behavior: "smooth"
            });
          });
        });
    }

    loadProduct();
  </script>

</body>
</html>
