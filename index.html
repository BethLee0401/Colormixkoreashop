<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>COLORMIX｜Korean Fashion</title>

  <meta
    name="description"
    content="精選正韓女裝，帶來簡約、高質感的韓系日常穿搭。"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      color: #222;
      background: #f8f6f2;
      font-family: Arial, "Noto Sans TC", sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      color: inherit;
      font-family: inherit;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(248, 246, 242, 0.97);
      border-bottom: 1px solid #e5e1da;
    }

    .nav {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 3px;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 25px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .cart-link {
      position: relative;
    }

    .cart-count {
      display: none;
      position: absolute;
      top: -13px;
      right: -14px;
      min-width: 18px;
      height: 18px;
      padding: 0 5px;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font-size: 10px;
      line-height: 18px;
      text-align: center;
    }

    .hero {
      min-height: 72vh;
      padding: 50px 7%;
      display: flex;
      align-items: flex-end;
      color: #fff;
      background:
        linear-gradient(
          rgba(0, 0, 0, 0.08),
          rgba(0, 0, 0, 0.28)
        ),
        url("https://images.unsplash.com/photo-1483985988355-763728e1935b?auto=format&fit=crop&w=1800&q=85")
        center / cover;
    }

    .hero-content {
      max-width: 520px;
    }

    .hero small {
      font-size: 12px;
      letter-spacing: 4px;
    }

    .hero h1 {
      margin: 15px 0;
      font-size: clamp(38px, 7vw, 80px);
      line-height: 1;
      letter-spacing: 4px;
    }

    .hero p {
      margin-bottom: 25px;
    }

    .hero-button {
      display: inline-block;
      padding: 13px 28px;
      border: 0;
      background: #fff;
      color: #222;
      font-size: 12px;
      letter-spacing: 2px;
      cursor: pointer;
    }

    .catalog {
      max-width: 1200px;
      margin: auto;
      padding: 80px 20px;
    }

    .catalog-layout {
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 45px;
      align-items: start;
    }

    .sidebar {
      position: sticky;
      top: 100px;
      padding-right: 25px;
      border-right: 1px solid #d8d3cb;
    }

    .sidebar-title {
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .sidebar-title.category-title {
      margin-top: 30px;
    }

    .filter-button {
      width: 100%;
      margin: 0 0 5px;
      padding: 9px 8px;
      border: 0;
      border-left: 3px solid transparent;
      background: transparent;
      font-size: 14px;
      text-align: left;
      cursor: pointer;
    }

    .filter-button:hover {
      background: #eeebe5;
    }

    .filter-button.active {
      border-left-color: #222;
      background: #eeebe5;
      font-weight: 700;
    }

    .catalog-main {
      min-width: 0;
    }

    .section-title {
      margin-bottom: 32px;
      padding-bottom: 17px;
      border-bottom: 1px solid #d8d3cb;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
    }

    .section-title h2 {
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 3px;
    }

    .section-title span {
      color: #777;
      font-size: 12px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px 18px;
    }

    .product {
      display: block;
    }

    .product-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      background: #eee;
      object-fit: cover;
    }

    .no-image {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: grid;
      place-items: center;
      background: #eee;
      color: #888;
      font-size: 13px;
    }

    .product-info {
      padding: 13px 2px;
    }

    .product-name {
      font-size: 14px;
      line-height: 1.6;
    }

    .product-type {
      margin-top: 4px;
      color: #888;
      font-size: 11px;
      letter-spacing: 1px;
    }

    .price {
      margin-top: 5px;
      color: #555;
      font-size: 13px;
    }

    .original-price {
      color: #999;
      text-decoration: line-through;
    }

    .sale-price {
      color: #b23b34;
      font-weight: 700;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 60px 20px;
      border: 1px dashed #bbb;
      color: #777;
      text-align: center;
    }

    .about {
      padding: 80px 20px;
      background: #eeebe5;
      text-align: center;
    }

    .about-inner {
      max-width: 650px;
      margin: auto;
    }

    .about h2 {
      margin-bottom: 20px;
      font-size: 28px;
      letter-spacing: 4px;
    }

    .about p {
      color: #666;
      font-size: 14px;
    }

    footer {
      padding: 50px 20px;
      background: #222;
      color: #fff;
      text-align: center;
    }

    footer .logo {
      margin-bottom: 15px;
    }

    footer p {
      color: #aaa;
      font-size: 12px;
    }

    .social-links {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 20px;
      font-size: 13px;
    }

    .social-links a {
      text-decoration: underline;
    }

    @media (max-width: 850px) {
      .catalog-layout {
        grid-template-columns: 155px 1fr;
        gap: 25px;
      }

      .products {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 650px) {
      .nav {
        padding: 18px;
      }

      .logo {
        font-size: 18px;
      }

      .menu {
        gap: 14px;
        font-size: 12px;
      }

      .menu .desktop-link {
        display: none;
      }

      .hero {
        min-height: 72vh;
        padding: 35px 25px;
      }

      .catalog {
        padding: 55px 15px;
      }

      .catalog-layout {
        display: block;
      }

      .sidebar {
        position: static;
        margin-bottom: 35px;
        padding: 0 0 22px;
        border-right: 0;
        border-bottom: 1px solid #d8d3cb;
      }

      .sidebar-buttons {
        display: flex;
        gap: 7px;
        overflow-x: auto;
        padding-bottom: 5px;
      }

      .sidebar-title.category-title {
        margin-top: 20px;
      }

      .filter-button {
        width: auto;
        min-width: max-content;
        padding: 9px 13px;
        border: 1px solid #ccc;
      }

      .filter-button.active {
        border-color: #222;
        background: #222;
        color: #fff;
      }

      .section-title h2 {
        font-size: 22px;
      }

      .products {
        gap: 15px 10px;
      }

      .product-name {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header>
    <nav class="nav">
      <a href="index.html" class="logo">COLORMIX</a>

      <div class="menu">
        <a
          class="desktop-link"
          href="#products"
          data-top-filter="stock"
        >
          現貨
        </a>

        <a
          class="desktop-link"
          href="#products"
          data-top-filter="live"
        >
          連線商品
        </a>

        <a href="member.html">會員中心</a>

        <a href="cart.html" class="cart-link">
          購物車
          <span id="cartCount" class="cart-count">0</span>
        </a>
      </div>
    </nav>
  </header>

  <section class="hero">
    <div class="hero-content">
      <small>KOREAN SELECTED FASHION</small>

      <h1>SEOUL<br>DAILY</h1>

      <p>精選韓國女裝，打造簡約而有型的每日穿搭。</p>

      <button
        id="shopButton"
        class="hero-button"
        type="button"
      >
        SHOP NOW
      </button>
    </div>
  </section>

  <section id="products" class="catalog">
    <div class="catalog-layout">

      <aside class="sidebar">
        <div class="sidebar-title">SHOP</div>

        <div class="sidebar-buttons">
          <button
            class="filter-button active"
            type="button"
            data-filter="stock"
          >
            現貨專區
          </button>

          <button
            class="filter-button"
            type="button"
            data-filter="live"
          >
            連線商品
          </button>

          <button
            class="filter-button"
            type="button"
            data-filter="all"
          >
            全部商品
          </button>
        </div>

        <div class="sidebar-title category-title">
          商品分類
        </div>

        <div class="sidebar-buttons">
          <button
            class="filter-button"
            type="button"
            data-category="tops"
          >
            上半身
          </button>

          <button
            class="filter-button"
            type="button"
            data-category="bottoms"
          >
            下半身
          </button>

          <button
            class="filter-button"
            type="button"
            data-category="dresses"
          >
            洋裝
          </button>

          <button
            class="filter-button"
            type="button"
            data-category="outer"
          >
            外套
          </button>

          <button
            class="filter-button"
            type="button"
            data-category="shoes"
          >
            鞋子
          </button>

          <button
            class="filter-button"
            type="button"
            data-category="accessories"
          >
            飾品
          </button>
        </div>
      </aside>

      <div class="catalog-main">
        <div class="section-title">
          <h2 id="catalogTitle">IN STOCK</h2>
          <span id="catalogSubtitle">現貨專區</span>
        </div>

        <div id="productList" class="products">
          <p>商品載入中⋯</p>
        </div>
      </div>

    </div>
  </section>

  <section class="about">
    <div class="about-inner">
      <h2>SEOUL DAILY</h2>

      <p>
        從韓國挑選日常服飾，
        將簡約、舒適與質感帶進每天的穿搭。
        我們希望每一件衣服，都能成為妳衣櫥裡真正會穿的那一件。
      </p>
    </div>
  </section>

  <footer>
    <div class="logo">COLORMIX</div>

    <p>Follow us on Facebook · Instagram</p>

    <div class="social-links">
      <a
        href="https://m.me/100063898780134"
        target="_blank"
        rel="noopener"
      >
        Facebook 私訊
      </a>

      <a
        href="https://ig.me/m/colormix637"
        target="_blank"
        rel="noopener"
      >
        Instagram 私訊
      </a>
    </div>

    <p style="margin-top:22px;">
      © 2026 COLORMIX
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const db = supabase.createClient(
      "https://qwcpgwbaormtgpkjlaio.supabase.co",
      "sb_publishable_RpbXHPZD_JT1giXP4nd0mw_6MMIjs3l"
    );

    const CART_KEY = "colormix_cart";

    let allProducts = [];
    let currentFilter = "stock";
    let currentCategory = "";

    const filterTitles = {
      stock: ["IN STOCK", "現貨專區"],
      live: ["LIVE COLLECTION", "連線商品"],
      all: ["ALL ITEMS", "全部商品"]
    };

    const categoryTitles = {
      tops: ["TOPS", "上半身"],
      bottoms: ["BOTTOMS", "下半身"],
      dresses: ["DRESSES", "洋裝"],
      outer: ["OUTER", "外套"],
      shoes: ["SHOES", "鞋子"],
      accessories: ["ACCESSORIES", "飾品"]
    };

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function normalizeImages(value) {
      let images = value;

      if (typeof images === "string") {
        try {
          images = JSON.parse(images);
        } catch (error) {
          images = [images];
        }
      }

      if (!Array.isArray(images)) {
        return [];
      }

      return images.map(function (item) {
        if (typeof item === "string") {
          return item;
        }

        if (item && typeof item === "object") {
          return item.url || item.publicUrl || "";
        }

        return "";
      }).filter(Boolean);
    }

    function salePrice(product) {
      const originalPrice = Number(product.price || 0);

      if (product.product_type === "stock") {
        return Math.round(originalPrice * 0.85);
      }

      return originalPrice;
    }

    function updateCartCount() {
      let cart = [];

      try {
        cart = JSON.parse(
          localStorage.getItem(CART_KEY) || "[]"
        );
      } catch (error) {
        cart = [];
      }

      const count = Array.isArray(cart)
        ? cart.reduce(function (total, item) {
            return total + Number(item.quantity || 1);
          }, 0)
        : 0;

      const cartCount =
        document.getElementById("cartCount");

      cartCount.textContent = count;
      cartCount.style.display =
        count > 0 ? "block" : "none";
    }

    function productCard(product) {
      const photos =
        normalizeImages(product.image_urls);

      const fallback =
        Number(product.id) === 1
          ? "image-1944593136204205.jpg"
          : "";

      const image = photos[0] || fallback;

      const imageHtml = image
        ? `
          <img
            class="product-image"
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name)}"
          >
        `
        : `
          <div class="no-image">
            尚未上傳照片
          </div>
        `;

      const isStock =
        product.product_type === "stock";

      const priceHtml = isStock
        ? `
          <div class="original-price">
            原價 NT$ ${Number(product.price || 0).toLocaleString("zh-TW")}
          </div>

          <div class="sale-price">
            NT$ ${salePrice(product).toLocaleString("zh-TW")}
          </div>
        `
        : `
          <div>
            NT$ ${Number(product.price || 0).toLocaleString("zh-TW")}
          </div>
        `;

      return `
        <a
          class="product"
          href="product.html?id=${encodeURIComponent(product.id)}"
        >
          ${imageHtml}

          <div class="product-info">
            <div class="product-name">
              ${escapeHtml(product.name)}
            </div>

            <div class="product-type">
              ${
  isStock
    ? (
        Number(product.stock_quantity || 0) > 0
          ? "IN STOCK｜現貨"
          : "RESTOCK｜追加"
      )
    : "LIVE COLLECTION"
}

            <div class="price">
              ${priceHtml}
            </div>
          </div>
        </a>
      `;
    }

    function renderProducts() {
      let products = allProducts;

      if (currentCategory) {
        products = allProducts.filter(function (product) {
          return product.category === currentCategory;
        });

        document.getElementById("catalogTitle").textContent =
          categoryTitles[currentCategory][0];

        document.getElementById("catalogSubtitle").textContent =
          categoryTitles[currentCategory][1];
      } else {
        if (currentFilter === "stock") {
          products = allProducts.filter(function (product) {
            return product.product_type === "stock";
          });
        }

        if (currentFilter === "live") {
          products = allProducts.filter(function (product) {
            return product.product_type !== "stock";
          });
        }

        document.getElementById("catalogTitle").textContent =
          filterTitles[currentFilter][0];

        document.getElementById("catalogSubtitle").textContent =
          filterTitles[currentFilter][1];
      }

      const list =
        document.getElementById("productList");

      list.innerHTML = products.length
        ? products.map(productCard).join("")
        : '<div class="empty">目前這個分類沒有商品</div>';
    }

    function selectFilter(button) {
      document
        .querySelectorAll(".filter-button")
        .forEach(function (item) {
          item.classList.remove("active");
        });

      button.classList.add("active");

      if (button.dataset.category) {
        currentCategory = button.dataset.category;
        currentFilter = "all";
      } else {
        currentCategory = "";
        currentFilter = button.dataset.filter;
      }

      renderProducts();
    }

    document
      .querySelectorAll(".filter-button")
      .forEach(function (button) {
        button.addEventListener("click", function () {
          selectFilter(button);
        });
      });

    document
      .querySelectorAll("[data-top-filter]")
      .forEach(function (link) {
        link.addEventListener("click", function () {
          currentCategory = "";
          currentFilter = link.dataset.topFilter;

          const matchingButton =
            document.querySelector(
              '[data-filter="' +
              currentFilter +
              '"]'
            );

          if (matchingButton) {
            selectFilter(matchingButton);
          }
        });
      });

    document
      .getElementById("shopButton")
      .addEventListener("click", function () {
        document
          .getElementById("products")
          .scrollIntoView({
            behavior: "smooth"
          });
      });

    async function loadProducts() {
      const list =
        document.getElementById("productList");

      const { data, error } = await db
        .from("Products")
        .select("*")
        .eq("active", true)
        .order("created_at", {
          ascending: false
        });

      if (error) {
        list.innerHTML =
          '<div class="empty">商品載入失敗，請稍後再試。</div>';
        return;
      }

      allProducts = data || [];
      renderProducts();
    }

    updateCartCount();
    loadProducts();
  </script>
</body>
</html>
